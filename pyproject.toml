[project]
name = "simwork"
version = "0.1.0"
description = "Simulate AI-app functionality first, before spending real LLM or world API calls — with evals on every run."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SRogDev" },
]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
simwork = "simwork.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[project.optional-dependencies]
# Opt-in only: the $0 default gate never imports deepeval. Install with
# `uv pip install 'simwork[deepeval]'` for the `simwork eval --judge` path.
deepeval = [
    "deepeval>=4.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
